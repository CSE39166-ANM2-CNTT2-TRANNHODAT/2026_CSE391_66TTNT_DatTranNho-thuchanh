<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>bài thực hành 1-bài 1</title>
    <link rel="stylesheet" href="th2-bai1.css" />
  </head>
  <body>
    <div class="form-box">
      <h3>Get in touch with us by filling contact form below</h3>

      <div class="row">
        <input type="text" placeholder="* Enter your full name" />
        <input type="email" placeholder="* Enter your email address" />
      </div>

      <div class="row">
        <input type="text" placeholder="Enter your subject" />
      </div>

      <div class="row">
        <textarea placeholder="* Your message here..." rows="8"></textarea>
      </div>

      <div class="footer-row">
        <button type="button">Send message</button>
        <span class="note">* Please fill all required form field, thanks!</span>
      </div>
    </div>
  </body>
</html>
